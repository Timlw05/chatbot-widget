<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Seite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/chatbot.css}">
</head>
<body>
    <main>
        <h1>Willkommen auf meiner Seite</h1>
        <p>Hier ist dein bestehender Seiteninhalt.</p>
    </main>
    <!-- Toggle Button unten rechts -->
    <button id="herbert-toggle" aria-label="Herbert öffnen">
        <svg id="icon-chat" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <svg id="icon-close" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>

    <!-- Chat Fenster -->
    <div id="herbert-window" class="hidden">
        <div id="herbert-header">
            <div id="herbert-avatar">H</div>
            <div id="herbert-info">
                <span id="herbert-name">Herbert</span>
                <span id="herbert-status">
                    <span id="status-dot"></span> Online
                </span>
            </div>
        </div>

        <!-- Nachrichten -->
        <div id="herbert-messages">
            <div class="message assistant">
                <div class="bubble">Hallo! Ich bin Herbert. Wie kann ich dir helfen?</div>
                <div class="time">Gerade eben</div>
            </div>
        </div>

        <!-- Eingabe -->
        <div id="herbert-input-area">
            <button id="herbert-clear" title="Chat leeren">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6l-1 14H6L5 6"></path>
                    <path d="M10 11v6"></path>
                    <path d="M14 11v6"></path>
                </svg>
            </button>
            <input type="file" id="herbert-file-input" accept="image/*,.pdf" style="display:none"></input>
            <button id="herbert-upload" title="Bild hochladen">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
            </button>
            <input type="text" id="herbert-input" placeholder="Nachricht schreiben..." autocomplete="off"/>
            <button id="herbert-send" aria-label="Senden">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
        <div id="herbert-preview" style="display:none">
            <img id="herbert-preview-img" src="" alt="Vorschau"/>
            <button id="herbert-preview-remove" title="Entfernen">✕</button>
        </div>

    <script th:src="@{/js/chatbot.js}"></script>
</body>
</html>
